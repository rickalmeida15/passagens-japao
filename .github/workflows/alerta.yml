# Salve como .github/workflows/alerta.yml (repositório PÚBLICO, sem chaves dentro dele).
# Secrets necessários (Settings > Secrets and variables > Actions): SERPAPI_KEY e NTFY_TOPIC
# Depois ative o app: Settings > Pages > Deploy from a branch > main / (root)
name: alerta-passagens-japao
on:
  schedule:
    - cron: "0 12 * * 1"   # segunda e quinta, 09h de Brasília
  workflow_dispatch: {}       # botão "Run workflow" para buscar na hora
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar passagens
        run: |
          python3 alerta_japao.py \
            --start 2027-02-15 --end 2027-03-31 --step 3 \
            --classes 1 --max-price 1:4500
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salvar histórico
        run: |
          git config user.name "alerta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "atualiza precos" && git push)
