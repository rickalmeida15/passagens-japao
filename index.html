<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passagens Japão</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f1419">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ln:#e4e7ec;--ok:#12805c;--bad:#c4302b;--ac:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#18202a;--tx:#eef1f5;--mut:#98a2b3;--ln:#2a3441;--ok:#3ecf9a;--bad:#ff6b66}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:calc(16px + env(safe-area-inset-top)) 0 8px}h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.price{font-size:26px;font-weight:700}
.mut{color:var(--mut);font-size:13px}.good{color:var(--ok)}.bad{color:var(--bad)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ok);color:#fff}
a.btn{display:inline-block;margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--ac);color:#fff;text-decoration:none;font-size:14px}
svg.chart{width:100%;height:90px;margin-top:8px}
label{display:block;margin:10px 0 4px;font-size:14px}input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<header><h1>✈️ Passagens Japão</h1><div class="sub" id="upd">carregando…</div></header>
<div class="tabs"><button id="t1" class="on">Econômica</button><button id="t3">Executiva</button><button id="tc">Ajustes</button></div>
<main id="app"></main>
<script>
const CLS = {1:"Econômica",3:"Executiva"};
let data = {records:[], limits:{}}, tab = 1;
const $ = s => document.querySelector(s);
const brl = n => "R$ " + Math.round(n).toLocaleString("pt-BR");
const lim = c => { try { const v = JSON.parse(localStorage.getItem("lim")||"{}"); if (v[c]) return +v[c]; } catch(e){} return data.limits?.[c] ?? null; };
const fdate = d => d.split("-").reverse().slice(0,2).join("/");
const flink = (r) => `https://www.google.com/travel/flights?q=Flights%20from%20${r.origin||"GRU"}%20to%20${r.arrival}%20on%20${r.date}%20one%20way`;

function chart(pts){
  if (pts.length < 2) return "";
  const W=300,H=90,p=6, mn=Math.min(...pts), mx=Math.max(...pts), rg=(mx-mn)||1;
  const xy = pts.map((v,i)=>[p+i*(W-2*p)/(pts.length-1), H-p-(v-mn)/rg*(H-2*p)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${xy.map(a=>a.join(",")).join(" ")}"/><circle cx="${xy.at(-1)[0]}" cy="${xy.at(-1)[1]}" r="4" fill="var(--ac)"/></svg>`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.id === "t"+tab));
  const app = $("#app");
  if (tab === "c") {
    app.innerHTML = `<div class="card"><b>Limite para destacar (por pessoa)</b>
      <label>Econômica (R$)</label><input id="l1" type="number" inputmode="numeric" value="${lim(1)??""}">
      <label>Executiva (R$)</label><input id="l3" type="number" inputmode="numeric" value="${lim(3)??""}">
      <p class="mut">Só muda o destaque aqui no app. O limite do aviso no celular fica no arquivo alerta.yml.</p></div>`;
    ["1","3"].forEach(c => $("#l"+c).oninput = e => { const v = JSON.parse(localStorage.getItem("lim")||"{}"); v[c] = e.target.value; localStorage.setItem("lim", JSON.stringify(v)); });
    return;
  }
  const recs = data.records.filter(r => r.cls === tab);
  if (!recs.length) { app.innerHTML = `<div class="empty">Ainda sem dados de ${CLS[tab]}.<br>Rode o workflow no GitHub para a primeira busca.</div>`; return; }
  const byDate = {};
  recs.forEach(r => (byDate[r.date] ||= []).push(r));
  const items = Object.entries(byDate).map(([d, list]) => {
    list.sort((a,b)=>a.ts.localeCompare(b.ts));
    const last = list.at(-1), prev = list.at(-2), min = Math.min(...list.map(x=>x.price));
    return {d, list, last, prev, min};
  }).sort((a,b)=>a.last.price-b.last.price);
  app.innerHTML = items.map(({d,list,last,prev,min}) => {
    const L = lim(tab), hit = L && last.price <= L;
    const diff = prev ? last.price - prev.price : 0;
    const dtxt = prev ? `<span class="${diff<=0?"good":"bad"}">${diff<=0?"▼":"▲"} ${brl(Math.abs(diff))}</span> desde a última busca` : "primeira busca";
    return `<div class="card"><div class="row"><div><div class="mut">Ida em ${fdate(d)}/${d.slice(0,4)}</div><div class="price ${hit?"good":""}">${brl(last.price)}</div></div>${hit?'<span class="badge">abaixo do limite</span>':""}</div>
      <div class="mut">casal: ${brl(last.price*2)} · mínimo visto: ${brl(min)}</div>
      <div class="mut">${dtxt}</div>
      <div class="mut">→ ${last.arrival} via ${last.stops.join("/")||"direto"} · ${last.airlines.join("/")} · ${last.hours}h</div>
      ${chart(list.map(x=>x.price))}
      <a class="btn" href="${flink(last)}" target="_blank" rel="noopener">Ver no Google Flights</a></div>`;
  }).join("");
}

async function load(){
  try {
    const r = await fetch("data/history.json?t=" + Date.now());
    data = await r.json();
    const u = data.updated ? new Date(data.updated) : null;
    $("#upd").textContent = u ? "Atualizado em " + u.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}) + " · preços por pessoa, sem conexão na América do Norte" : "sem dados ainda";
  } catch(e) { $("#upd").textContent = "sem dados ainda"; }
  render();
}
["1","3","c"].forEach(k => $("#t"+k).onclick = () => { tab = k==="c" ? "c" : +k; render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
</body>
</html>
